
name: APEX-1 CI

on:
  push:
    branches:
      - main
      - "release/**"
      - "feat/**"
  pull_request:
    branches:
      - main

concurrency:
  group: apex1-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }} course-ready checks
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,vision]"

      - name: Course-ready quick check
        run: |
          python scripts/course_ready_check.py --mode quick

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

      - name: Upload course-ready report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: course-ready-report-${{ matrix.python-version }}
          path: outputs/course_ready_report.json
          if-no-files-found: ignore
